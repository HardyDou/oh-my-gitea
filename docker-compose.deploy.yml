# 完整部署：docker compose --env-file .env.docker -f docker-compose.deploy.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea_pm
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.docker 中设置数据库密码}
    volumes:
      - pm-deploy-postgres:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d gitea_pm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://pm:${POSTGRES_PASSWORD:?请设置数据库密码}@postgres:5432/gitea_pm
      # Gitea 地址、OAuth 凭据及管理员密码在页面设置。
      GITEA_REDIRECT_URI: ${APP_URL:?请设置浏览器访问地址}/auth/gitea/callback
      CORS_ORIGIN: ${APP_URL:?请设置浏览器访问地址}
      # 新部署自动生成持久化密钥；升级时继续传入原 SESSION_SECRET。
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_SECRET_FILE: /app/data/session-secret
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    volumes:
      - pm-backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pm-deploy-postgres:
  pm-backend-data:
