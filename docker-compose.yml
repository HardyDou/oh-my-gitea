services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gitea_pm
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pm-postgres:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d gitea_pm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pm-postgres:
